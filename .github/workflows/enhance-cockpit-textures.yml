name: Enhance A330 cockpit textures

on:
  push:
    paths:
      - ".github/workflows/enhance-cockpit-textures.yml"
      - "scripts/enhance_cockpit_textures.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --upgrade Pillow

      - name: Install DirectXTex converter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "tools", "$env:RUNNER_TEMP\directxtex" | Out-Null
          $installed = $false
          $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "WVA-cockpit-texture-workflow" }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXTex/releases/latest" -Headers $headers
            foreach ($asset in @($release.assets | Where-Object { $_.name -match "\.zip$" })) {
              try {
                $zip = Join-Path "$env:RUNNER_TEMP\directxtex" $asset.name
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
                $dest = Join-Path "$env:RUNNER_TEMP\directxtex" ([IO.Path]::GetFileNameWithoutExtension($asset.name))
                Expand-Archive -Path $zip -DestinationPath $dest -Force
                $exe = Get-ChildItem $dest -Filter "texconv.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($exe) {
                  Copy-Item $exe.FullName "tools\texconv.exe" -Force
                  Write-Host "Found texconv.exe in $($asset.name)"
                  $installed = $true
                  break
                }
                Write-Host "No texconv.exe in $($asset.name); trying next asset."
              } catch {
                Write-Host "Skipping asset $($asset.name): $($_.Exception.Message)"
              }
            }
          } catch {
            Write-Host "DirectXTex release lookup failed: $($_.Exception.Message)"
          }
          if (-not $installed) {
            throw "Could not find texconv.exe in any DirectXTex release ZIP. See preceding asset diagnostics."
          }
          if ((Get-Item "tools\texconv.exe").Length -lt 100000) { throw "texconv.exe is missing or unexpectedly small." }
          & "tools\texconv.exe" -?
          if ($LASTEXITCODE -ne 0) { throw "texconv.exe failed its startup check." }

      - name: Download Real-ESRGAN portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Use the official, known Windows asset. The ncnn-vulkan project does not
          # consistently expose a latest-release asset matching a dynamic filename.
          $url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          $dir = Join-Path "$env:RUNNER_TEMP" "realesrgan"
          $expanded = Join-Path $dir "expanded"
          New-Item -ItemType Directory -Force -Path $dir, $expanded, "tools" | Out-Null
          $zip = Join-Path $dir "realesrgan-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-Item $zip).Length -lt 1000000) { throw "Real-ESRGAN archive download is unexpectedly small" }
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $exe = Get-ChildItem $expanded -Filter "realesrgan-ncnn-vulkan.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "realesrgan-ncnn-vulkan.exe missing. Archive contents: $((Get-ChildItem $expanded -Recurse | ForEach-Object FullName) -join '; ')" }
          # The official portable archive contains its own models folder and runtime files.
          Copy-Item (Join-Path $exe.DirectoryName "*") "tools" -Recurse -Force
          if (-not (Test-Path "tools\models\realesrgan-x4plus.param")) {
            $model = Get-ChildItem "tools" -Filter "realesrgan-x4plus.param" -Recurse | Select-Object -First 1
            if (-not $model) { throw "realesrgan-x4plus model missing from portable archive" }
            New-Item -ItemType Directory -Force -Path "tools\models" | Out-Null
            Copy-Item (Join-Path $model.DirectoryName "*") "tools\models" -Force
          }
          if (-not (Test-Path "tools\models\realesrgan-x4plus.bin")) { throw "realesrgan-x4plus.bin missing from portable archive" }
          Write-Host "Real-ESRGAN portable Windows build installed."

      - name: Enhance DDS textures
        run: python scripts/enhance_cockpit_textures.py

      - name: Commit enhanced DDS textures to the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "int*.dds"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No texture changes to commit."
            exit 0
          }
          git commit -m "Enhance A330 cockpit DDS textures [skip ci]"
          git push origin HEAD:main
