name: Enhance A330 cockpit textures

on:
  push:
    paths:
      - ".github/workflows/enhance-cockpit-textures.yml"
      - "scripts/enhance_cockpit_textures.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    # The workflow's own output commit must not start a second processing pass.
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --upgrade Pillow

      - name: Download Microsoft's DirectXTex converter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXTex/releases/latest" -Headers @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "WVA-cockpit-texture-workflow" }
          $asset = $release.assets | Where-Object { $_.name -match "Desktop_2022_Win10.*\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match "Desktop.*Win10.*\.zip$" } | Select-Object -First 1
          }
          if (-not $asset) {
            throw ("No Windows desktop ZIP containing texconv was found in DirectXTex release " + $release.tag_name + ". Assets: " + (($release.assets | ForEach-Object name) -join ", "))
          }
          New-Item -ItemType Directory -Force -Path tools, "$env:RUNNER_TEMP\directxtex" | Out-Null
          $zip = Join-Path "$env:RUNNER_TEMP\directxtex" $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\directxtex\expanded" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\directxtex\expanded" -Filter "texconv.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "texconv.exe was not found inside downloaded release archive $($asset.name)" }
          Copy-Item $exe.FullName "tools\texconv.exe" -Force
          if ((Get-Item "tools\texconv.exe").Length -lt 100000) { throw "texconv.exe download looks incomplete" }
          Write-Host "Installed texconv from $($asset.name)"

      - name: Download Real-ESRGAN AI upscaler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/xinntao/Real-ESRGAN-ncnn-vulkan/releases/latest" -Headers @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "WVA-cockpit-texture-workflow" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match "ncnn-vulkan.*\.zip$" } | Select-Object -First 1
          }
          if (-not $asset) {
            throw ("No Windows Real-ESRGAN ZIP found in release " + $release.tag_name + ". Assets: " + (($release.assets | ForEach-Object name) -join ", "))
          }
          Write-Host "Using Real-ESRGAN release $($release.tag_name), asset $($asset.name)"
          $dir = Join-Path "$env:RUNNER_TEMP" "realesrgan"
          $expanded = Join-Path $dir "expanded"
          New-Item -ItemType Directory -Force -Path $dir, $expanded, "tools", "tools\models" | Out-Null
          $zip = Join-Path $dir $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $exe = Get-ChildItem $expanded -Filter "realesrgan-ncnn-vulkan.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "realesrgan-ncnn-vulkan.exe was not found. Archive contents: $((Get-ChildItem $expanded -Recurse | ForEach-Object FullName) -join '; ')" }
          # Keep adjacent runtime files alongside the executable, not just the EXE.
          Copy-Item (Join-Path $exe.DirectoryName "*") "tools" -Recurse -Force
          $models = Get-ChildItem $expanded -Directory -Recurse | Where-Object { $_.Name -eq "models" } | Select-Object -First 1
          if (-not $models) { throw "Real-ESRGAN models folder was not found. Archive contents: $((Get-ChildItem $expanded -Recurse | ForEach-Object FullName) -join '; ')" }
          Copy-Item (Join-Path $models.FullName "*") "tools\models" -Recurse -Force
          $modelParam = Get-ChildItem "tools\models" -Filter "realesrgan-x4plus.param" -Recurse | Select-Object -First 1
          if (-not $modelParam) { throw "realesrgan-x4plus.param is missing. Installed models: $((Get-ChildItem tools\models -Recurse | ForEach-Object FullName) -join '; ')" }
          $modelBin = Join-Path $modelParam.DirectoryName "realesrgan-x4plus.bin"
          if (-not (Test-Path $modelBin)) { throw "Matching realesrgan-x4plus.bin is missing beside $($modelParam.FullName)" }
          # Normalize any nested model folder to the path the executable expects.
          if ($modelParam.DirectoryName -ne (Resolve-Path "tools\models").Path) {
            Copy-Item (Join-Path $modelParam.DirectoryName "*") "tools\models" -Force
          }
          if ((Get-Item "tools\realesrgan-ncnn-vulkan.exe").Length -lt 100000) { throw "Real-ESRGAN executable download looks incomplete" }
          Write-Host "Real-ESRGAN executable and x4plus model installed successfully."
          Get-ChildItem tools -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Enhance DDS textures
        run: python scripts/enhance_cockpit_textures.py

      - name: Commit enhanced DDS textures to the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "int*.dds"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No texture changes to commit."
            exit 0
          }
          git commit -m "Enhance A330 cockpit DDS textures [skip ci]"
          git push origin HEAD:main
