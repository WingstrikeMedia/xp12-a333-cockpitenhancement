name: Enhance A330 cockpit textures

on:
  push:
    paths:
      - ".github/workflows/enhance-cockpit-textures.yml"
      - "scripts/enhance_cockpit_textures.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Real-ESRGAN and image dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.2+cpu torchvision==0.16.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2" Pillow opencv-python-headless realesrgan==0.3.0 basicsr==1.4.2

      - name: Download Real-ESRGAN x4plus model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          $url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth"
          Invoke-WebRequest -Uri $url -OutFile "tools\RealESRGAN_x4plus.pth"
          if ((Get-Item "tools\RealESRGAN_x4plus.pth").Length -lt 50000000) { throw "Real-ESRGAN model download is unexpectedly small." }
          Write-Host "Downloaded official Real-ESRGAN x4plus model for CPU inference."

      - name: Install DirectXTex converter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "tools", "$env:RUNNER_TEMP\directxtex" | Out-Null
          $installed = $false
          $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "WVA-cockpit-texture-workflow" }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXTex/releases/latest" -Headers $headers
            foreach ($asset in @($release.assets | Where-Object { $_.name -match "\.zip$" })) {
              try {
                $zip = Join-Path "$env:RUNNER_TEMP\directxtex" $asset.name
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
                $dest = Join-Path "$env:RUNNER_TEMP\directxtex" ([IO.Path]::GetFileNameWithoutExtension($asset.name))
                Expand-Archive -Path $zip -DestinationPath $dest -Force
                $exe = Get-ChildItem $dest -Filter "texconv.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($exe) {
                  Copy-Item $exe.FullName "tools\texconv.exe" -Force
                  Write-Host "Found texconv.exe in $($asset.name)"
                  $installed = $true
                  break
                }
                Write-Host "No texconv.exe in $($asset.name); trying next asset."
              } catch {
                Write-Host "Skipping asset $($asset.name): $($_.Exception.Message)"
              }
            }
          } catch {
            Write-Host "DirectXTex release lookup failed: $($_.Exception.Message)"
          }
          if (-not $installed) {
            Write-Host "No release ZIP contained texconv.exe. Installing the official Microsoft WinGet package."
            winget install --id Microsoft.DirectXTex.Texconv --exact --silent --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { throw "WinGet failed to install Microsoft.DirectXTex.Texconv (exit $LASTEXITCODE)." }
            $exe = Get-Command "texconv.exe" -ErrorAction SilentlyContinue
            if ($exe) {
              Copy-Item $exe.Source "tools\texconv.exe" -Force
            } else {
              $roots = @("$env:ProgramFiles", "$env:LOCALAPPDATA\Microsoft\WinGet\Packages")
              $exe = Get-ChildItem $roots -Filter "texconv.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $exe) { throw "WinGet completed, but texconv.exe could not be found under the standard install roots." }
              Copy-Item $exe.FullName "tools\texconv.exe" -Force
            }
          }
          if (-not (Test-Path "tools\texconv.exe") -or (Get-Item "tools\texconv.exe").Length -lt 100000) {
            throw "texconv.exe is missing or unexpectedly small."
          }
          & "tools\texconv.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "texconv.exe failed its startup check." }

      - name: Enhance DDS textures
        run: python scripts/enhance_cockpit_textures.py

      - name: Commit enhanced DDS textures to the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "int*.dds"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No texture changes to commit."
            exit 0
          }
          git commit -m "Enhance A330 cockpit DDS textures [skip ci]"
          git push origin HEAD:main
